dependencies:
  # 1.3.x adds the ST7121 panel path and picks the panel at runtime by board
  # version, keeping ILI9881C. Do not drop to 1.2.0 (see the tab5-board skill).
  espressif/m5stack_tab5: "~1.3.0"
  # Wi-Fi lives on the on-board ESP32-C6, reached over SDIO. Floor, do not pin:
  # below 2.12.10 CONFIG_ESP32P4_TAB5_C6_BOARD silently vanishes from Kconfig
  # and the SDIO pins fall back to EV-board defaults.
  espressif/esp_hosted: ">=2.12.10,<3.0"
  espressif/esp_wifi_remote: "*"
  # Route cache on flash. LittleFS rather than SPIFFS: a wall board gets
  # unplugged mid-write, and LittleFS is power-loss safe.
  joltwallet/littlefs: "^1.23.1"
description: Epsom Wall Board
